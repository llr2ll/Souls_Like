<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>O Camiño das Ánimas</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <div id="fps-element"></div>
    <div id="root-window"><div id="render-target"></div></div>
    <div id="hud">
      <div id="bars">
        <div class="bar hp"><i class="lag"></i><i class="fill"></i></div>
        <div class="bar stamina"><i></i></div>
      </div>
      <div id="target-bar"><i class="fill"></i><b class="posture"></b></div>
      <div id="boss"><b class="name"></b><div class="track"><i class="lag"></i><i class="fill"></i></div><i class="posture"></i></div>
      <div id="ending"><b>A névoa se abre</b><p>Fim da demo. Obrigado por caminhar até aqui.</p></div>
      <div id="danger"></div>
      <div id="cera"><b>0</b><small>cera</small></div>
      <div id="prompt"></div>
      <div id="title"></div>
      <div id="paper"><b></b><p></p></div>
      <div id="death"><span>A névoa te levou</span></div>
      <div id="items">
        <div class="slot gourd" title="Cabaça (R / X)">
          <svg viewBox="0 0 40 40"><circle cx="20" cy="27" r="10" fill="#c9a14a"/><circle cx="20" cy="13" r="6.5" fill="#d4ad55"/><rect x="17.5" y="3" width="5" height="5" fill="#6b4a2b"/></svg>
          <b>4</b><small>R</small>
        </div>
        <div class="slot bread" title="Pão de milho (F / Y)">
          <svg viewBox="0 0 40 40"><ellipse cx="20" cy="23" rx="14" ry="8" fill="#d9b25a"/><ellipse cx="20" cy="20" rx="11" ry="4" fill="#ecca7a"/></svg>
          <b>3</b><small>F</small>
        </div>
      </div>
      <div id="note"></div>
      <div id="help">Teclado: WASD anda · Espaço: tocar rola, segurar corre · clique leve · Shift+clique pesado · direito escudo · Shift+direito apara · Q trava · R cabaça · F pão · M som</div>
    </div>
    <script type="module">
      import { LoadGame } from './src/game/main.js'
      window.onload = async () => (window.scene = await LoadGame())
    </script>
  </body>
</html>
