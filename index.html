<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>O Camiño das Ánimas</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <div id="fps-element"></div>
    <div id="root-window"><div id="render-target"></div></div>
    <div id="hud">
      <div id="bars">
        <div class="bar hp"><i class="lag"></i><i class="fill"></i></div>
        <div class="bar stamina"><i></i></div>
      </div>
      <div id="target-bar"><i class="fill"></i><b class="posture"></b></div>
      <div id="note"></div>
      <div id="help">Teclado: WASD anda · Espaço: tocar rola, segurar corre · clique leve · Shift+clique pesado · direito escudo · Shift+direito apara · Q trava · M som</div>
    </div>
    <script type="module">
      import { LoadGame } from './src/game/main.js'
      window.onload = async () => (window.scene = await LoadGame())
    </script>
  </body>
</html>
